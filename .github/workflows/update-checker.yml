name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 6'

permissions:
  contents: write

concurrency:
  group: padavan-update-checker
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/MeIsReallyBa/padavan-4.4
  REPO_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get upstream commit
        id: upstream
        run: |
          commit=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | cut -f 1)
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check for an existing build trigger
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/padavan-source-hash
          key: padavan-${{ steps.upstream.outputs.commit }}

      - name: Trigger build for new source
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type='Source Code Update' \
            -f "client_payload[commit]=$SOURCE_COMMIT"

      - name: Save triggered commit
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SOURCE_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: printf '%s\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/padavan-source-hash"

      - name: Cache triggered commit
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/padavan-source-hash
          key: padavan-${{ steps.upstream.outputs.commit }}
